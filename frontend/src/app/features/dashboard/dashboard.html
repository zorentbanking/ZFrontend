<div class="container mt-5">
  <!-- FR-DASH-03: Consolidated Net Worth Banner -->
  <div class="net-worth-banner p-4 mb-5 rounded-4 shadow-sm text-white">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h5 class="text-uppercase opacity-75 fw-bold mb-1">Total Net Worth</h5>
        <h1 class="display-4 fw-bold">{{ netWorth | currency }}</h1>
      </div>
      <div class="col-md-4 text-md-end">
        <button class="btn btn-light btn-lg fw-bold rounded-pill px-4">
          <i class="bi bi-plus-circle me-2"></i>New Account
        </button>
      </div>
    </div>
  </div>

  <h3 class="mb-4 fw-bold text-dark">Your Accounts</h3>

  <!-- FR-DASH-01: Display all accounts -->
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let acc of accounts">
      <div class="card h-100 border-0 shadow-sm account-card">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between mb-3">
            <span class="badge rounded-pill bg-primary-soft text-primary px-3 py-2">
              {{ acc.accountType }}
            </span>
            <span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>{{ acc.status }}</span>
          </div>
          <h6 class="text-muted mb-1">Account Number</h6>
          <h5 class="fw-bold mb-4">{{ acc.accountNumber }}</h5>

          <h6 class="text-muted mb-1">Available Balance</h6>
          <h3 class="fw-bold text-dark">{{ acc.balance | currency }}</h3>
        </div>
        <!-- FR-DASH-04: Quick Action Links -->
        <div class="card-footer bg-transparent border-0 p-4 pt-0 d-flex gap-2">
          <button class="btn btn-outline-dark flex-grow-1">Transactions</button>
          <button class="btn btn-primary flex-grow-1">Transfer</button>
        </div>
      </div>
    </div>
  </div>
</div>
