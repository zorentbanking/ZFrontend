<div class="auth-container d-flex align-items-center justify-content-center">
  <div class="card auth-card shadow-lg p-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Zorent Banking</h2>
      <p class="text-muted">Secure Login Portal</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" formControlName="username" placeholder="Enter username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" formControlName="password" placeholder="Enter password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" [disabled]="loginForm.invalid">
        Sign In Securely
      </button>
      <div class="text-center mt-3">
        <a routerLink="/register" class="text-decoration-none small">New to Zorent? Create an Account</a>
      </div>
    </form>
  </div>
</div>
